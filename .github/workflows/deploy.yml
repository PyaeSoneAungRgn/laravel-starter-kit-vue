name: Deploy to DigitalOcean

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to deploy'
        required: true
        default: 'release/staging'
        type: string
      environment:
        description: 'Environment (lists the repository environments; its secrets are used)'
        type: environment
        required: true
      service:
        description: 'Service'
        type: choice
        required: true
        default: 'api'
        options:
          - api
          - backend
          - task
          - horizon
          - reverb
          - nightwatch-agent
      mode:
        description: 'Deploy mode (fast skips the image build unless a rebuild is required)'
        type: choice
        required: true
        default: 'fast'
        options:
          - fast
          - full

concurrency:
  group: deploy-${{ inputs.environment }}-${{ inputs.service }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      # `branch` is free text now, so reject anything that is not a plain branch
      # name before the value reaches the remote git commands as $BRANCH.
      - name: Validate branch
        env:
          BRANCH: ${{ inputs.branch }}
        run: |
          case "$BRANCH" in
            ''|*[!A-Za-z0-9._/-]*)
              echo "::error::Invalid branch name: $BRANCH"
              exit 1
              ;;
          esac
          git check-ref-format --branch "$BRANCH" >/dev/null

      - name: Deploy to selected server
        uses: appleboy/ssh-action@v1.2.0
        env:
          BRANCH: ${{ inputs.branch }}
        with:
          envs: BRANCH
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USERNAME }}
          key: ${{ secrets.DO_SSH_KEY }}
          port: ${{ secrets.DO_PORT || 22 }}
          script: |
            set -eu
            cd "${{ secrets.APP_PATH }}"

            # www-data's UID/GID is baked into the images at build time and has
            # to match the owner of this checkout, because storage/logs is
            # bind-mounted from the host. Exporting the deploy user's IDs keeps
            # the log file writable by the containers after a rebuild.
            export PUID=$(id -u)
            export PGID=$(id -g)

            # Follow the selected branch instead of pulling it into whichever
            # branch the checkout was on: `git pull origin <branch>` fast-forwards
            # the *current* branch and keeps its name, so naming the wrong branch
            # silently replaced that environment's code and left the deployment
            # looking successful. --ff-only means local commits on the checkout
            # are never discarded quietly; a diverged checkout fails the deploy.
            BEFORE=$(git rev-parse HEAD)
            git fetch origin "+refs/heads/$BRANCH:refs/remotes/origin/$BRANCH"
            if git show-ref --verify --quiet "refs/heads/$BRANCH"; then
              git checkout "$BRANCH"
              git pull --ff-only origin "$BRANCH"
            else
              # Start from the ref fetched above: a single-branch clone has no
              # remote-tracking ref for other branches.
              git checkout -b "$BRANCH" --no-track "origin/$BRANCH"
            fi

            # --ff-only reports "Already up to date" when the checkout is *ahead*
            # of the remote branch, so a server-side commit would otherwise be
            # deployed without ever reaching origin. Refuse instead of shipping
            # code that is not on the branch.
            if [ "$(git rev-parse HEAD)" != "$(git rev-parse "origin/$BRANCH")" ]; then
              echo "Deploy checkout is not at origin/$BRANCH; reset it on the server first." >&2
              exit 1
            fi

            CHANGED=$(git diff --name-only "$BEFORE" HEAD)

            # Application source is bind-mounted on the host, so most commits
            # only need a cache refresh and a worker reload. Rebuild only when
            # something the image itself owns changed: dependency manifests,
            # Docker/compose definitions, the public directory, or frontend
            # assets (npm run build output is baked into the image).
            NEEDS_BUILD=0
            if [ "${{ inputs.mode }}" = "full" ]; then
              NEEDS_BUILD=1
            fi
            if printf '%s\n' "$CHANGED" | grep -qE \
              '^composer\.(json|lock)$|^package(-lock)?\.json$|^vite\.config\.ts$|^tsconfig\.json$|^components\.json$|^Dockerfile(\.cli)?$|^compose\.[^/]+$|^\.dockerignore$|^public/|^app-modules/[^/]+/composer\.json$|(^|/)resources/(js|css)/'; then
              NEEDS_BUILD=1
            fi

            if [ "$NEEDS_BUILD" = "1" ]; then
              docker compose up -d "${{ inputs.service }}" --build
            else
              docker compose up -d "${{ inputs.service }}"
            fi

            case "${{ inputs.service }}" in
              api|backend)
                docker compose exec -T "${{ inputs.service }}" php artisan optimize
                # Additive and idempotent: creates permissions for new models and
                # refreshes the package cache. Requires `php artisan migrate` to
                # have run once on the host after this feature ships.
                docker compose exec -T "${{ inputs.service }}" php artisan rbac:sync --no-interaction
                docker compose exec -T "${{ inputs.service }}" php artisan octane:reload --server=frankenphp
                ;;
              horizon)
                docker compose exec -T horizon php artisan horizon:terminate
                ;;
              reverb|task)
                docker compose restart "${{ inputs.service }}"
                ;;
            esac
