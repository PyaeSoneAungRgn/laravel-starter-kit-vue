x-common-env: &common-env
  PHP_OPCACHE_ENABLE: '1'
  AUTORUN_ENABLED: 'true'
  AUTORUN_LARAVEL_MIGRATION: 'false'
  PHP_OPCACHE_MEMORY_CONSUMPTION: '256'
  # Application source is bind-mounted (see x-app-mounts), so opcache has to
  # revalidate file mtimes or edits keep being served from the old bytecode.
  PHP_OPCACHE_VALIDATE_TIMESTAMPS: '1'
  PHP_OPCACHE_INTERNED_STRINGS_BUFFER: '16'
  PHP_OPCACHE_MAX_ACCELERATED_FILES: '20000'
  PHP_MEMORY_LIMIT: '128M'
  PHP_MAX_EXECUTION_TIME: '30'
  PHP_POST_MAX_SIZE: '8M'
  PHP_UPLOAD_MAX_FILE_SIZE: '2M'
  # Keeps config('octane.server') in sync with the --server option below, so
  # `artisan octane:reload` (used by the fast deploy path) targets the server
  # that is actually running instead of the config default of "roadrunner".
  OCTANE_SERVER: 'frankenphp'
  NIGHTWATCH_TOKEN: '${NIGHTWATCH_TOKEN}'
  NIGHTWATCH_INGEST_URI: 'nightwatch-agent:2407'

# Application source, bind-mounted so `git pull` on the host updates running
# containers without an image build. Deliberately not a `./:/var/www/html`
# mount: vendor/, node_modules/, public/build/, storage/, bootstrap/cache/ and
# .env stay from the image, so assets built by `npm run build` still ship.
#
# Only paths the application READS are mounted here. storage/ is intentionally
# NOT mounted: Octane writes its process id file to storage/logs while the app
# writes logs, sessions and caches under storage/. Binding a host-owned
# directory over it makes those writes fail with "Permission denied", because
# the host's uid does not match the container's www-data. Leaving it to the
# image keeps the www-data ownership that COPY --chown established.
x-app-mounts: &app-mounts
  - ./app:/var/www/html/app
  - ./app-modules:/var/www/html/app-modules
  - ./bootstrap/app.php:/var/www/html/bootstrap/app.php
  - ./bootstrap/providers.php:/var/www/html/bootstrap/providers.php
  - ./config:/var/www/html/config
  - ./database:/var/www/html/database
  - ./public/index.php:/var/www/html/public/index.php
  - ./resources:/var/www/html/resources
  - ./routes:/var/www/html/routes

services:
  api:
    build: .
    container_name: 'api'
    networks:
      - laravel
    ports:
      # The default keeps production on port 80. Other environments override it
      # from .env, e.g. API_PUBLISHED_PORT=127.0.0.1:8080 when a host nginx
      # already owns port 80 and proxies to the container.
      - '${API_PUBLISHED_PORT:-80}:8080'
    environment:
      <<: *common-env
      SSL_MODE: 'off'
    command: ['php', 'artisan', 'octane:start', '--server=frankenphp', '--port=8080']
    volumes: *app-mounts
    healthcheck:
      test: ['CMD', 'healthcheck-octane']
      start_period: 10s

  backend:
    build: .
    container_name: 'backend'
    networks:
        - laravel
    ports:
      - '${BACKEND_PUBLISHED_PORT:-8080}:8080'
    environment:
      <<: *common-env
      SSL_MODE: 'off'
    command: ['php', 'artisan', 'octane:start', '--server=frankenphp', '--port=8080']
    volumes: *app-mounts
    healthcheck:
      test: ['CMD', 'healthcheck-octane']
      start_period: 10s

  reverb:
      build:
        context: .
        dockerfile: Dockerfile.cli
      container_name: 'reverb'
      ports:
        - '8000:8000'
      networks:
        - laravel
      environment:
        <<: *common-env
      command: ["php", "/var/www/html/artisan", "reverb:start", "--port=8000"]
      volumes: *app-mounts
      stop_signal: SIGTERM
      healthcheck:
        test: ["CMD", "healthcheck-reverb"]
        start_period: 10s

  horizon:
    build:
      context: .
      dockerfile: Dockerfile.cli
    container_name: 'horizon'
    networks:
      - laravel
    environment:
      <<: *common-env
      PHP_MEMORY_LIMIT: '512M'
    command: ['php', '/var/www/html/artisan', 'horizon']
    volumes: *app-mounts
    stop_signal: SIGTERM
    healthcheck:
      test: ['CMD', 'healthcheck-horizon']
      start_period: 10s

  task:
    build:
      context: .
      dockerfile: Dockerfile.cli
    container_name: 'task'
    networks:
      - laravel
    environment:
      <<: *common-env
      PHP_MEMORY_LIMIT: '512M'
    command: ['php', '/var/www/html/artisan', 'schedule:work']
    volumes: *app-mounts
    stop_signal: SIGTERM
    healthcheck:
      test: ['CMD', 'healthcheck-schedule']
      start_period: 10s

  nightwatch-agent:
    image: laravelphp/nightwatch-agent:latest
    container_name: 'nightwatch-agent'
    networks:
      - laravel
    environment:
      NIGHTWATCH_TOKEN: '${NIGHTWATCH_TOKEN}'
    healthcheck:
      test: php nightwatch-status
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped

networks:
  laravel:
    driver: bridge
